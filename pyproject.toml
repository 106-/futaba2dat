[project]
name = "futaba2dat"
version = "0.1.0"
description = ""
authors = [
    {name = "t106", email = "segmentation-fault@yandex.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "Jinja2>=3.1.6",
    "beautifulsoup4>=4.9.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.11.12",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests (may be slow and require external dependencies)"
]
asyncio_mode = "auto"

[tool.ruff]
lint.select = ["I"]
